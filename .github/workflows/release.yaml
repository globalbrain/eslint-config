name: Release

on:
  push:
    branches: [main]
    paths: [deno.json, package.json]
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, prepatch, preminor, premajor, prerelease, or an explicit version
        required: true
        type: string

concurrency: release

jobs:
  release:
    if: github.repository == 'globalbrain/eslint-config'
    uses: globalbrain/hado/.github/workflows/release.reusable.yaml@b85b1b491ddaacce3cec12c06e8d563b44b5b38a # v0.22.8
    with:
      version: ${{ inputs.version }}
      setup: pnpm build
      publish: pnpm publish --access public
      environment: npm
      environment_url: https://npmx.dev/package/@globalbrain/eslint-config/v/{0}
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
